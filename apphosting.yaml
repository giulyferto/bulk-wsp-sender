runConfig:
  minInstances: 1

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAXZYvIjBfr2lcieEtWkDNK0Cgj6iFpEkw
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: bulk-wsp-sender
    availability:
      - RUNTIME

  - variable: NEXTAUTH_URL
    value: REPLACE_WITH_YOUR_DEPLOYED_URL
    availability:
      - RUNTIME

  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
    availability:
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
